name: Build examples

# Builds every example against the latest PUBLISHED Speculor SDK bundle from
# speculor-sdk-dist. This is the authoritative "do the examples still build
# against the deployed SDK" check — the bundle is self-contained, so no vcpkg
# or system OpenCV/FFmpeg is needed, only a compiler + Ninja.

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly drift check: the examples build against the LATEST published SDK
  # bundle, which moves independently of this repo. Nothing here re-runs when a
  # new bundle ships, so without a schedule an SDK API break can sit undetected
  # (the 0.13 → 0.25 gap went unverified this way). Monday 06:17 UTC.
  schedule:
    - cron: '17 6 * * 1'
  # Fired by the speculor-sdk release workflow after it publishes a new bundle,
  # so drift is caught on release day rather than up to a week later.
  repository_dispatch:
    types: [sdk-released]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-latest,  asset: 'SpeculorSDK-*-Linux-x86_64.tar.gz' }
          - { name: Windows, os: windows-latest, asset: 'SpeculorSDK-*-Windows-x64.zip' }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Download latest SDK bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sdk
          gh release download -R speculor-app/speculor-sdk-dist \
            --pattern '${{ matrix.asset }}' --dir sdk
          ls -la sdk

      - name: Extract SDK + locate root
        id: sdk
        shell: bash
        run: |
          mkdir -p sdk/x
          if ls sdk/*.zip >/dev/null 2>&1; then
            # -DD: stamp every extracted entry with the extraction time instead
            # of the archive's stored timestamp. The Windows bundle is zipped
            # with naive-local DOS timestamps (no timezone), so files packaged
            # on a UTC+N box otherwise land in the future on this UTC runner and
            # CMake/Ninja loop forever ("build.ninja still dirty"). Defends this
            # CI even against already-published bundles that predate the
            # package-sdk.ps1 timestamp fix.
            unzip -qDD sdk/*.zip -d sdk/x
          else
            tar -xzf sdk/*.tar.gz -C sdk/x
          fi
          cfg=$(find "$PWD/sdk/x" -name SpeculorSDKConfig.cmake | head -1)
          if [ -z "$cfg" ]; then echo "::error::SpeculorSDKConfig.cmake not found in bundle"; exit 1; fi
          root="${cfg%/lib/cmake/SpeculorSDK/SpeculorSDKConfig.cmake}"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Resolved SDK root: $root"

      # ── Linux toolchain ──────────────────────────────────────────────
      # ninja to build; libva/libdrm because the SDK's bundled FFmpeg is built
      # with VA-API hardware acceleration, so linking spclib pulls -lva/-lva-drm
      # (system libraries, not shipped in the bundle).
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libva-dev libdrm-dev

      # ── Windows toolchain (MSVC + Ninja) ─────────────────────────────
      # vcvarsall via vswhere — works on the VS2022 image and stays valid if
      # the runner is upgraded to VS2026 (-prerelease). Mirrors speculor-sdk.
      - name: Setup MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vsw)) { throw "vswhere not found at $vsw" }
          $vsPath = & $vsw -latest -prerelease -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio instance" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not at $vcvars" }
          $output = cmd /c "`"$vcvars`" x64 && set"
          foreach ($line in $output) {
              if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') {
                  "$($matches[1])=$($matches[2])" |
                      Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_ENV
              }
          }

      - name: Setup Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6

      # ── Configure + build ────────────────────────────────────────────
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ steps.sdk.outputs.root }}" \
            -DSPECULOR_BUILD_TESTS=ON

      - name: Build
        shell: bash
        run: cmake --build build

      - name: List built plugins
        shell: bash
        run: ls -la build/plugins

      # Conformance dlopens each example, so the bundle's shared libraries have
      # to be resolvable — a plugin that cannot load its dependencies is
      # indistinguishable from one that exports no vtable.
      - name: Run tests
        shell: bash
        env:
          SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$SDK_ROOT/bin:$PATH"
          else
            export LD_LIBRARY_PATH="$SDK_ROOT/lib:${LD_LIBRARY_PATH:-}"
          fi
          ctest --test-dir build --output-on-failure --timeout 300
